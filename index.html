<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Pribadi</title>

<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>

</head>
<body>

<div class="container">

    <div class="card profile">

        <img src="assets/profile.jpg" class="profile-img">

        <h2>Dildawg</h2>

        <p>Pelajar PPLG</p>

    </div>

    <div class="card">

        <h2>👋 Selamat Datang</h2>

        <h1 id="greeting"></h1>

        <p id="clock"></p>

    </div>

    <div class="card">

        <h2>📚 To Do</h2>

        <input id="taskInput" placeholder="Tambah tugas...">

        <button onclick="addTask()">Tambah</button>

        <ul id="taskList"></ul>

    </div>

    <div class="card">

        <h2>📝 Catatan</h2>

        <textarea id="note" placeholder="Tulis catatan..."></textarea>

    </div>

</div>

</body>
</html>
